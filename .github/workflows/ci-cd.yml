# CI/CD: test -> build -> deploy.
# test и build идут на каждый push/PR, deploy — только при push в main.
# Нужные секреты репозитория: SERVER_HOST (IP сервера) и SSH_KEY (приватный ключ для root).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: backend

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Тег образов = короткий SHA коммита
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Собрать образы
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t shop-backend:$TAG backend
          docker build -t shop-frontend:$TAG frontend
          docker save shop-backend:$TAG shop-frontend:$TAG | gzip > images.tar.gz

      - name: Сохранить образы для deploy
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать образы из build
        uses: actions/download-artifact@v4
        with:
          name: images

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Загрузить образы на сервер
        run: ssh root@$HOST 'gunzip | microk8s ctr image import -' < images.tar.gz

      - name: Применить манифесты
        run: |
          for f in infra/k8s/*.yaml; do sed "s/\(shop-[a-z]*\):1\.0/\1:$TAG/" "$f"; echo "---"; done \
            | ssh root@$HOST 'microk8s kubectl apply -f -'
          ssh root@$HOST "microk8s kubectl -n shop rollout status deploy/backend --timeout=300s && \
                          microk8s kubectl -n shop rollout status deploy/frontend --timeout=120s"

      - name: Удалить старые образы (на сервере мало места)
        run: |
          ssh root@$HOST "microk8s ctr images ls -q | grep -E 'shop-(backend|frontend):' | grep -v ':$TAG\$' | xargs -r microk8s ctr images rm"

      - name: Проверка
        run: curl -fsS --retry 5 --retry-delay 3 http://$HOST/api/health
