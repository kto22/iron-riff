# CI/CD: test -> build -> deploy.
# test и build идут на каждый push/PR; при push в main образы пушатся в ghcr.io,
# а deploy подтягивает их на сервер (прямая загрузка с раннеров GitHub на VPS слишком медленная).
# Нужные секреты репозитория: SERVER_HOST (IP сервера) и SSH_KEY (приватный ключ для root).
name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: backend

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Тег образов = короткий SHA коммита
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать образы
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $REGISTRY/backend:$TAG backend
          docker build -t $REGISTRY/frontend:$TAG frontend

      - name: Запушить образы (только main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker push $REGISTRY/backend:$TAG
          docker push $REGISTRY/frontend:$TAG

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      TAG: ${{ needs.build.outputs.tag }}
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Доступ кластера к ghcr.io
        # токен передаём через stdin, чтобы он не попал в историю команд на сервере
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh root@$HOST "microk8s kubectl -n shop create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username=${{ github.actor }} --docker-password=\"\$(cat)\" \
            --dry-run=client -o yaml | microk8s kubectl apply -f -"

      - name: Освободить место на сервере
        # диск всего 10 ГБ: удаляем образы магазина, которые сейчас не запущены
        run: |
          ssh root@$HOST 'used=$(microk8s kubectl -n shop get pods -o jsonpath="{.items[*].spec.containers[*].image}");
            for img in $(microk8s ctr images ls -q | grep -E "(shop-|iron-riff/)(backend|frontend):"); do
              echo "$used" | grep -qw "${img#docker.io/library/}" || microk8s ctr images rm "$img";
            done; df -h / | tail -1'

      - name: Применить манифесты
        run: |
          for f in infra/k8s/*.yaml; do
            sed -e "s#image: shop-\(backend\|frontend\):1\.0#image: $REGISTRY/\1:$TAG#" \
                -e "s#imagePullPolicy: Never.*#imagePullPolicy: IfNotPresent#" "$f"; echo "---"
          done | ssh root@$HOST 'microk8s kubectl apply -f -'
          ssh root@$HOST "microk8s kubectl -n shop rollout status deploy/backend --timeout=600s && \
                          microk8s kubectl -n shop rollout status deploy/frontend --timeout=300s"

      - name: Удалить старые образы
        run: |
          ssh root@$HOST "microk8s ctr images ls -q | grep -E '(shop-|iron-riff/)(backend|frontend):' | grep -v ':$TAG\$' | xargs -r microk8s ctr images rm"

      - name: Проверка
        run: curl -fsS --retry 5 --retry-delay 3 http://$HOST/api/health
