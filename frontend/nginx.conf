server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # В k8s запросы /api идут через ingress сразу в backend,
    # а этот прокси нужен для запуска через docker compose.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
    }
    location / { try_files $uri $uri/ /index.html; }
}
