# PostgreSQL через Crunchy Postgres Operator (PGO), 1 реплика.
# Оператор сам создаёт пользователя shop и секрет shop-db-pguser-shop (ключ uri).
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: shop-db
  namespace: shop
  annotations:
    # создать схему "shop" владельцем которой будет пользователь shop (PG15+)
    postgres-operator.crunchydata.com/autoCreateUserSchema: "true"
spec:
  postgresVersion: 16
  instances:
    - name: main
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 512Mi }
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: microk8s-hostpath
        resources:
          requests: { storage: 1Gi }
  users:
    - name: shop
      databases: [shop]
